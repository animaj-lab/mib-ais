[project]
name = "animatics-to-motion"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "reportlab>=4.2.2",
    "mlflow>=2.16.0",
    "tqdm>=4.66.5",
    "pyarrow>=17.0.0",
    "polars>=1.6.0",
    "boto3>=1.35.10",
    "pillow>=10.4.0",
    "omegaconf>=2.2.0",
    "loguru>=0.7.2",
    "opencv-python>=4.10.0.84",
    "typer>=0.12.5",
    "transformers>=4.44.2,<=4.50.3",
    "pandas>=2.2.2",
    "numpy>=1",
    "einops>=0.8.0",
    "psutil>=5.9.8",
    "pydantic>=2.10.3",
    "h5py>=3.12.1",
    "pydantic-settings>=2.8.1",
    "safetensors>=0.4.0",
    "hf-xet>=1.5.0",
]

[dependency-groups]
training = [
    "rdp>=0.8.0",
    "plotly>=5.24.0",
    "matplotlib>=3.9.2",
    "tensorboard>=2.18.0",
    "python-dotenv>=1.0.1",
    "moviepy==1.0.3",
    "optuna>=4.4.0",
    "ray[tune]>=2.47.1",
]

dev = [
    "pre-commit>=3.8.0",
    "ruff>=0.6.7",
    "pytest>=8.3.2",
    "pytest-bdd>=7.1.2",
    "pytest-cov>=5.0.0",
    "sagemaker>=2.237.0",
    "graphene>=3.4.3",
]

pytorch = ["pytorch-lightning>=2.4.0", "torchvision>=0.18"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# see all rules: https://docs.astral.sh/ruff/rules/
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "ISC", # flake8-implicit-str-concat
    # "ANN", # flake8-annotations
    "I", # isort
    # "D",   # pydocstyle. Note: docstring are not required, but when present they should be correct
    "T10", # flake8-debugger
    # "T20", # flake8-print
]

ignore = [
    "ANN204", #  Missing return type annotation for special method
    "ANN101", #  Missing type annotation for self in method
    "ANN102", #  Missing type annotation for cls in classmethod
    "ANN002", #  Missing type annotation for *args
    "ANN003", #  Missing type annotation for *kwargs
    "ANN401", #  Dynamically typed expressions (typing.Any) are disallowed
    "D100",   #  Missing docstring in public module
    "D101",   #  Missing docstring in public class
    "D102",   #  Missing docstring in public method
    "D103",   #  Missing docstring in public function
    "D104",   #  Missing docstring in public package
    "D105",   #  Missing docstring in magic method
    "D106",   #  Missing docstring in public nested class
    "D107",   #  Missing docstring in `__init__`
    "ISC001", #  single-line-implicit-string-concatenation (conflict with formatter)
]

unfixable = [
    "F401", # unused-import
    "F841", # unused-variable
]

[tool.ruff.lint.pydocstyle]
# We are not strict on the presence of docstring by default. But If we are, then it should be google style
convention = "google"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
mypy-init-return = true
suppress-dummy-args = true


[tool.ruff.lint.isort]
# isort can't find local imports if the path of the local packages are not relative from the root of the repo. In this case, packages need to be added here
# see https://docs.astral.sh/ruff/settings/#isort-known-local-folder for more info
#known-local-folder=
